<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Verifikasi Selesai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ee4d2d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }

    .top-bar h1 {
      color: #fff;
      font-size: 18px;
      font-weight: 600;
    }

    .step-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px 16px;
    }

    .step {
      height: 4px;
      border-radius: 2px;
      flex: 1;
    }

    .step.done { background: #fff; }

    .card {
      background: #fff;
      border-radius: 12px 12px 0 0;
      flex: 1;
      padding: 48px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .success-icon {
      width: 96px;
      height: 96px;
      background: linear-gradient(135deg, #ee4d2d, #ff7043);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(238,77,45,0.3);
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-icon svg {
      width: 48px;
      height: 48px;
      stroke: #fff;
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw 0.4s 0.35s ease forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      text-align: center;
      margin-bottom: 10px;
    }

    .card-sub {
      font-size: 14px;
      color: #999;
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
      margin-bottom: 36px;
    }

    .summary-box {
      width: 100%;
      background: #fafafa;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .summary-item .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .summary-item .icon svg {
      width: 20px;
      height: 20px;
      stroke: #ee4d2d;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .summary-item .text p {
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    .summary-item .text span {
      font-size: 12px;
      color: #aaa;
    }

    .summary-item .check {
      margin-left: auto;
      width: 22px;
      height: 22px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .summary-item .check svg {
      width: 12px;
      height: 12px;
      stroke: #4caf50;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .btn-app {
      width: 100%;
      background: #ee4d2d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-app svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-app:hover { background: #d73e20; }
    .btn-app:active { opacity: 0.85; }

    .btn-home {
      width: 100%;
      background: #fff;
      color: #ee4d2d;
      border: 1.5px solid #ee4d2d;
      border-radius: 8px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-home:hover { background: #fff5f3; }
    .btn-home:active { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Verifikasi Identitas</h1>
  </div>

  <div class="step-indicator">
    <div class="step done"></div>
    <div class="step done"></div>
    <div class="step done"></div>
  </div>

  <div class="card">
    <div class="success-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <p class="card-title">Verifikasi Berhasil!</p>
    <p class="card-sub">Data kamu sudah kami terima. Proses verifikasi sedang berjalan.</p>

    <div class="summary-box">
      <div class="summary-item">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <circle cx="8.5" cy="10.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <div class="text">
          <p>Foto KTP</p>
          <span>Berhasil diunggah</span>
        </div>
        <div class="check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>

      <div class="summary-item">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="text">
          <p>Foto Selfie</p>
          <span>Berhasil diunggah</span>
        </div>
        <div class="check">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-app" onclick="bukaAplikasi()">
        <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
        Buka Aplikasi Shopee
      </button>
      <button class="btn-home" onclick="window.location.href='index.html'">Kembali ke Beranda</button>
    </div>
  </div>

  <script>
    function bukaAplikasi() {
      const deeplink = 'shopee://';
      const fallback = 'https://shopee.co.id/';
      const start = Date.now();
      window.location.href = deeplink;
      setTimeout(function () {
        if (Date.now() - start < 2000) {
          window.location.href = fallback;
        }
      }, 1500);
    }
  </script>
</body>
</html>
